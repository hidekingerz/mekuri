name: CI

on:
  push:
    branches: [main, deno-desktop]
  pull_request:
    branches: [main, deno-desktop]

jobs:
  frontend:
    name: Frontend (TypeScript / React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

  deno:
    name: Backend (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deno-app
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # deno desktop の型（lib="deno.desktop"）を含む最初の安定版。main.ts の check に必要。
          deno-version: "2.9.1"

      - name: Verify (fmt, lint, type-check, test)
        run: deno task verify
