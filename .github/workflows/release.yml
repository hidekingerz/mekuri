name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install

      - name: Build
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg

      # tauri-action's built-in uploader cannot resolve artifact paths for
      # explicit --target builds (tauri-apps/tauri-action#243), so upload
      # the bundle to the tag's release with the gh CLI instead.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" --clobber \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          gh release edit "$tag" --draft=false
